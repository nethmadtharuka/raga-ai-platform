name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: # "Run workflow" button, for any branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install, lint, test and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm test
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven verify
        env:
          GEMINI_API_KEY: ci-test-key
          APP_API_KEY: test-api-key
        run: mvn -B verify
