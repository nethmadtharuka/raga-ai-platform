# Server
server.port=8080

# API authentication (required for /api/** except /api/health/**). Use X-API-Key or Authorization: Bearer
app.api.key=${APP_API_KEY:}
app.webhook.api-key=${WEBHOOK_API_KEY:}

# Gemini API Configuration (set GEMINI_API_KEY in environment or application-local.properties — never commit secrets)
gemini.api.key=${GEMINI_API_KEY:}
# Text model and the model used when its free-tier quota runs out. Change via env vars, no rebuild needed.
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}
gemini.max-retries=${GEMINI_MAX_RETRIES:1}
gemini.retry-backoff-ms=1000
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:20000}
# Embeddings must stay on the model the stored vectors were made with.
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
# ChromaDB Configuration
chroma.url=${CHROMA_URL:http://localhost:8000}
chroma.collection.name=research_documents_v2
# Document Chunking Configuration
chunking.max-chunk-size=500
chunking.overlap-size=50

# Logging
logging.level.com.nethmadtharuka=INFO
logging.level.org.springframework.web=WARN
# INFO, not DEBUG: request logging at DEBUG can write document text and request details to the logs.
logging.level.org.springframework.web.reactive.function.client=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# Actuator (for monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs