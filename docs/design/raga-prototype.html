<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RAGA AI Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: violet hero with giant wordmark, dark/lime/white bands for the site; calm white panels for the notebook app */
:root{
 --b-violet:#5B3CFF;--b-violet-d:#3A1FD1;--b-lime:#B9FA3C;--b-navy:#04045E;--b-pink:#FF7BC8;--b-ink:#0A0A14;
 --bg:#F2F2F9;--surface:#fff;--surface-2:#EAEAF5;--ink:#0B0B22;--ink-2:#575772;--line:#DEDEEC;
 --accent:#4B2FE8;--accent-soft:#E6E0FF;
 --ok:#137A40;--ok-soft:#DCF4E6;--warn:#9A5B00;--warn-soft:#FFEBC7;--bad:#C72A34;--bad-soft:#FFE0E2;
 --f-display:'Anton','Impact',sans-serif;--f-body:'Inter',system-ui,sans-serif;--f-serif:'Instrument Serif',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A10;--surface:#14141D;--surface-2:#1F1F2C;--ink:#F4F4FB;--ink-2:#A8A8C2;--line:#2C2C3E;--accent:#A092FF;--accent-soft:#2A2458;--ok:#5EE394;--ok-soft:#10301F;--warn:#FFB547;--warn-soft:#3A2A0A;--bad:#FF7079;--bad-soft:#3C1519;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0A10;--surface:#14141D;--surface-2:#1F1F2C;--ink:#F4F4FB;--ink-2:#A8A8C2;--line:#2C2C3E;--accent:#A092FF;--accent-soft:#2A2458;--ok:#5EE394;--ok-soft:#10301F;--warn:#FFB547;--warn-soft:#3A2A0A;--bad:#FF7079;--bad-soft:#3C1519;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
h1,h2,h3,h4,h5,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.hero :focus-visible,.dark :focus-visible,.navy :focus-visible{outline-color:#fff}
.lime :focus-visible{outline-color:#0A0A14}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.sb{justify-content:space-between}.center{justify-content:center}.wrapx{flex-wrap:wrap}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mt24{margin-top:24px}.mt40{margin-top:40px}
.muted{color:var(--ink-2);font-size:13px}
.ic{flex:none}
em{font-family:var(--f-serif);font-style:italic;font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:none}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.lime{background:var(--b-lime);color:#10130A}.btn.violet{background:var(--b-violet);color:#fff}.btn.dark{background:var(--b-ink);color:#fff}
.btn.soft{background:var(--surface-2);color:var(--ink)}.btn.ghost{border:2px solid currentColor}.btn.ghost.ink{color:#10130A}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{height:36px;padding:0 15px;font-size:13px}
.btn .arr{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--b-ink);color:var(--b-lime);margin-right:-12px}
.btn.dark .arr{background:var(--b-lime);color:#10130A}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn.inv{background:transparent;border:2px solid rgba(255,255,255,.55);color:#fff}
.iconbtn.sm{width:30px;height:30px}
.iconbtn:hover{background:var(--surface-2)}
.link{color:var(--accent);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}.link:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;min-width:0}
/* ===== website ===== */
.hero{background:var(--b-violet);color:#fff;position:relative;overflow:hidden;padding-bottom:56px}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:12px;height:76px}
.logo{font-family:var(--f-display);font-size:32px;letter-spacing:.02em;color:var(--b-lime);line-height:1;text-transform:uppercase}
.lnav .links{display:flex;gap:6px}
.lnav .links button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1.5px solid rgba(255,255,255,.35);color:#fff}
.lnav .links button:hover{background:rgba(255,255,255,.14)}
.hero-word{position:relative;text-align:center;margin-top:8px}
.hero-word h1{font-family:var(--f-display);font-weight:400;font-size:clamp(130px,34vw,430px);line-height:.88;letter-spacing:.01em;text-transform:uppercase;color:#fff}
.hero-mascot{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(130px,26vw,320px);pointer-events:none;animation:bob 4.5s ease-in-out infinite}
.hero-mascot .mascot{width:100%;height:auto;filter:drop-shadow(0 18px 26px rgba(10,10,60,.4))}
.badge-spin{position:absolute;right:max(4%,16px);bottom:2%;width:clamp(86px,13vw,150px);animation:spin 20s linear infinite}
.scrib-l,.scrib-r{position:absolute;pointer-events:none}
.scrib-l{left:-2%;top:30%;width:clamp(120px,22vw,300px)}.scrib-r{right:-1%;top:-2%;width:clamp(100px,18vw,240px)}
.scrib{width:100%;height:auto}
.hero-sub{max-width:620px;margin:28px auto 0;text-align:center;font-size:19px;line-height:1.5;font-weight:500}
.hero-sub em{font-size:1.25em;color:var(--b-lime)}
@keyframes bob{50%{transform:translate(-50%,-54%) rotate(2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.band{padding:84px 0;position:relative}.band.nopad{padding:0;overflow:hidden}
.band.dark{background:#0C0C12;color:#fff}.band.navy{background:var(--b-navy);color:#fff}.band.lime{background:var(--b-lime);color:#10130A}.band.light{background:var(--surface);color:var(--ink)}.band.soft{background:var(--bg);color:var(--ink)}
.ribbon{background:var(--b-lime);color:#10130A;transform:rotate(-1.2deg);margin:26px -3%;overflow:hidden;white-space:nowrap;padding:14px 0;font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.rib-track{display:inline-flex;gap:26px;animation:mq 34s linear infinite}.rib-track i{font-style:normal;color:var(--b-violet)}
@keyframes mq{to{transform:translateX(-50%)}}
.big{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(46px,8vw,104px);line-height:.95}
.big em{text-transform:none;font-size:1.12em;color:var(--b-lime)}
.big.dk em{color:var(--b-violet)}.big.ink em{color:var(--b-violet-d)}
:root[data-theme="dark"] .big.dk em{color:var(--b-lime)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big.dk em{color:var(--b-lime)}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px}.sh p{max-width:420px;font-size:16px;opacity:.8}
.lead{font-size:19px;line-height:1.6;margin-top:22px;max-width:520px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{border-radius:22px;padding:20px;min-height:176px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile h3{font-size:21px;line-height:1.1;font-weight:700}.tile p{font-size:14px;opacity:.85}
.tile.v{background:var(--b-violet);color:#fff}.tile.p{background:var(--b-pink);color:#1A0A14}.tile.l{background:var(--b-lime);color:#10130A}.tile.w{background:#fff;color:#10130A}
.tic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.22);flex:none}
.tile.l .tic,.tile.p .tic,.tile.w .tic,.bt.l .tic,.bt.p .tic{background:rgba(0,0,0,.1)}
/* preview mock */
.mock{background:#1A1A26;border-radius:26px;padding:14px;border:1px solid #2C2C40;box-shadow:0 30px 60px -30px rgba(91,60,255,.6);display:grid;grid-template-columns:170px 1fr;gap:12px;color:#fff}
.mock .ms{background:#0E0E18;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.mock .ms h5{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.mock .ms li{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;background:#1A1A28;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mock .ms li i{width:8px;height:8px;border-radius:50%;background:var(--b-lime);flex:none}
.mock .mc{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-q{align-self:flex-end;background:var(--b-violet);padding:11px 15px;border-radius:20px 20px 4px 20px;max-width:86%;font-size:14px}
.pv-a{display:flex;gap:10px;align-items:flex-start;background:#0E0E18;border-radius:20px;padding:14px;font-size:14px}
.mk{display:inline-grid;place-items:center;min-width:18px;height:18px;margin:0 3px;border-radius:6px;background:var(--b-lime);color:#10130A;font-size:11px;font-weight:800;vertical-align:super;line-height:1}
.pv-s{display:flex;gap:8px;flex-wrap:wrap}.pv-s span{font-size:12px;padding:6px 10px;border-radius:999px;background:#222234;display:inline-flex;gap:6px;align-items:center}
.pv-s b{background:var(--b-lime);color:#10130A;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:11px}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bt{border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:12px;min-height:240px;align-items:flex-start}
.bt h3{font-size:24px;font-weight:700;line-height:1.12;margin-top:auto}.bt p{font-size:15px;opacity:.85}
.bt.v{background:var(--b-violet);color:#fff}.bt.v .tic{background:rgba(255,255,255,.22)}.bt.p{background:var(--b-pink);color:#1A0A14}.bt.l{background:var(--b-lime);color:#10130A}.bt.w{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.bt.w .tic{background:var(--accent-soft);color:var(--accent)}
.tilts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:18px 6px}
.tilt{border-radius:28px;padding:26px 24px;min-height:260px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;transform:rotate(var(--r));transition:transform .25s}
.tilt:hover{transform:rotate(0) translateY(-6px)}
.tilt h3{font-size:28px;line-height:1.05;font-weight:700}.tilt p{font-size:15px;opacity:.88}
.tilt.l{background:var(--b-lime);color:#10130A}.tilt.v{background:var(--b-violet);color:#fff}.tilt.p{background:var(--b-pink);color:#1A0A14}
.tn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.14);font-weight:800;font-size:18px}
.tilt.v .tn{background:rgba(255,255,255,.22)}
.uses{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.use{border-radius:26px;padding:22px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:12px;min-height:280px}
.use .tic{background:var(--accent-soft);color:var(--accent)}.use h3{font-size:22px;font-weight:700;line-height:1.1}.use p{font-size:14.5px;color:var(--ink-2)}
.use blockquote{margin:auto 0 0;padding:12px 14px;border-radius:16px;background:var(--bg);font-size:13.5px;font-weight:600}
.trust{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.trust .bub-demo{background:var(--b-lime);color:#10130A;border-radius:32px;padding:26px;display:flex;flex-direction:column;gap:14px}
.faq{max-width:820px;margin:0 auto}
.faq details{border-top:1.5px solid var(--line);padding:20px 4px}.faq details:last-child{border-bottom:1.5px solid var(--line)}
.faq summary{font-size:20px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:16px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:26px;line-height:1;color:var(--accent);flex:none}
.faq details[open] summary::after{content:"–"}
.faq p{margin-top:12px;color:var(--ink-2);font-size:16px;max-width:640px}
.cta{text-align:center;padding:100px 0}
.mega{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(60px,13vw,190px);line-height:.9}.mega em{text-transform:none;color:var(--b-violet-d)}
.foot{background:#08080D;color:#fff;padding:56px 0 28px;overflow:hidden}
.foot-word{font-family:var(--f-display);font-size:clamp(100px,26vw,340px);line-height:.82;color:var(--b-violet);text-transform:uppercase}
.foot-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;font-size:13px;opacity:.85}.foot-row button,.foot-row a{font-weight:600}
/* ===== app ===== */
.apptop{background:var(--surface);border-bottom:1px solid var(--line)}
.apptop .wrap{display:flex;align-items:center;gap:14px;height:64px}
.apptop .logo{font-size:28px;color:var(--accent)}
:root[data-theme="dark"] .apptop .logo{color:var(--b-lime)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .apptop .logo{color:var(--b-lime)}}
.apptop nav{display:flex;gap:4px;margin-right:auto;margin-left:10px}
.apptop nav a{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2)}.apptop nav a.on{background:var(--b-lime);color:#10130A}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--b-violet);color:#fff;display:grid;place-items:center;font-weight:700}
.page{padding-block:28px 48px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,6vw,72px);line-height:1;text-transform:uppercase}
.ph p{color:var(--ink-2);margin-top:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 16px;height:44px;color:var(--ink-2);min-width:min(280px,100%)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink)}
.search:focus-within{border-color:var(--accent)}
.nbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.nbc{border-radius:28px;padding:22px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;align-items:flex-start;text-align:left;position:relative;overflow:hidden;transition:transform .2s}
.nbc:hover{transform:translateY(-4px) rotate(-.6deg)}
.nbc h3{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.nbc small{font-size:13px;opacity:.85}
.nbc.violet{background:var(--b-violet);color:#fff}.nbc.lime{background:var(--b-lime);color:#10130A}.nbc.pink{background:var(--b-pink);color:#1A0A14}.nbc.white{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.nbc .mascot{position:absolute;right:-6px;bottom:-4px;opacity:.95}
.nbc.add{border:2px dashed var(--line);background:transparent;color:var(--ink-2);align-items:center;justify-content:center;text-align:center}
.nbc.add .tic{background:var(--surface-2);color:var(--ink)}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}.empty p{color:var(--ink-2);max-width:380px;font-size:14px;margin-bottom:6px}.empty h3{font-size:18px}
/* workspace */
.wsh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.wsh h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,46px);text-transform:uppercase;line-height:1;margin-right:auto}
.tabs3{display:none;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px}
.tabs3 button{flex:1;padding:9px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);text-align:center}.tabs3 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.ws{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:14px;height:calc(100vh - 210px);min-height:560px}
.panel{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 18px 10px}.ph2 h2{font-size:15px;font-weight:700}
.pbody{padding:6px 14px 16px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.src{border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.src.off{opacity:.6}.src.bad{border-color:var(--bad);background:var(--bad-soft)}
.src .top{display:flex;align-items:center;gap:10px}
.src .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}.src .nm small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.src .err{font-size:12.5px;color:var(--bad)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-2);display:grid;place-items:center;flex:none;color:transparent}
.chk.on{background:var(--b-lime);border-color:#10130A;color:#10130A}
.ft{display:inline-grid;place-items:center;min-width:40px;height:22px;padding:0 6px;border-radius:7px;font-size:10px;font-weight:800;background:var(--surface-2);flex:none;letter-spacing:.02em;text-transform:uppercase}
.ft.pdf{background:#FFD9DC;color:#8A1520}.ft.docx{background:#D9E5FF;color:#173B9A}.ft.xlsx,.ft.csv{background:#D8F5E2;color:#136638}.ft.md,.ft.txt{background:#ECECF4;color:#40405A}.ft.html,.ft.link{background:#FFE8CC;color:#8A4A00}.ft.json{background:#EEE0FF;color:#5A2AB0}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.chat{flex:1;min-height:0;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px}.msg.u{justify-content:flex-end}
.bub{padding:12px 16px;border-radius:22px 22px 6px 22px;background:var(--b-violet);color:#fff;max-width:82%;overflow-wrap:anywhere}
.bub.ai{background:var(--bg);color:var(--ink);border-radius:6px 22px 22px 22px;max-width:100%;flex:1;min-width:0;padding:14px 16px}
.bub.ai.warn{background:var(--warn-soft);border:1.5px dashed var(--warn)}.bub.ai.err{background:var(--bad-soft);border:1.5px solid var(--bad)}
.bub.ai h4{font-size:15px;display:flex;gap:8px;align-items:center;margin-bottom:6px}.bub.ai p{font-size:15px;margin-bottom:10px}.bub.ai p:last-child{margin-bottom:0}

function run(nb,m,fail){
 m.st='loading';m.stage=0;m.words=0;paintChat();const T=S.timers;
 T.push(setTimeout(()=>{m.stage=1;paintChat()},450),setTimeout(()=>{m.stage=2;paintChat()},950));
 T.push(setTimeout(()=>{
  if(fail){m.st='err';paintChat();return}
  const r=build(nb,m.q);Object.assign(m,r);
  if(!r.found){const qa=findQA(nb,m.q);m.partialOff=!!qa;m.st='none';paintChat();return}
  m.st='stream';m.total=m.segs.reduce((a,s)=>a+s.t.split(' ').length,0);
  const iv=setInterval(()=>{m.words+=2;if(m.words>=m.total){m.words=m.total;m.st='done';clearInterval(iv)}paintChat()},45);T.push(iv);
 },1500));
}
function seed(){const nb=nbBy('n1');if(S.chats.n1)return;const m={r:'a',q:nb.sugg[0],st:'done',words:0};Object.assign(m,build(nb,m.q));S.chats.n1=[{r:'u',t:m.q},m]}
/* ===== add sources ===== */
let uid=0;
function addSrc(nb,o){const s=Object.assign({id:'u'+(++uid)+Date.now().toString(36),on:true,status:'reading',prog:0,user:true,paras:['This prototype does not read uploaded files. In the real app, the text of this source would appear here.']},o);nb.sources.push(s);nb.updated='Just now';
 if(s.status==='reading'){const iv=setInterval(()=>{s.prog+=16+Math.random()*14;if(s.prog>=100){clearInterval(iv);s.status='ready';s.prog=0;s.pages=s.pages||'Ready'}paintSide()},320);S.timers.push(iv)}paintSide();return s}
function addFiles(list){const nb=cur();let n=0;Array.from(list).forEach(f=>{const ext=(f.name.split('.').pop()||'').toLowerCase(),type=ext==='markdown'?'md':ext;if(OK.includes(type))addSrc(nb,{name:f.name,type,pages:Math.max(1,Math.round(f.size/3000))+' pages'});else addSrc(nb,{name:f.name,type:OK.includes(type)?type:'file',status:'failed',error:'RAGA can’t read .'+ext+' files. Try a PDF, Word, Excel, text, Markdown or CSV file.'});n++});S.modal=null;paintModal();toast(n+' source'+(n>1?'s':'')+' added. Files stay in your browser in this prototype.')}
/* ===== modals ===== */
function paintModal(){
 const L=$('#layer');if(!S.modal){L.innerHTML='';return}
 if(S.viewer){const nb=cur(),s=nb.sources.find(x=>x.id===S.viewer.id);L.innerHTML=`<div class="scrim" data-act="closem"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Source"><div class="row sb g12"><div>${ft(s.type)}<h3 style="margin-top:8px">${esc(s.name)}</h3><span class="muted">${esc(s.pages||'')}</span></div><button class="iconbtn" data-act="closem" aria-label="Close">${ic('x',18)}</button></div>${s.user?'':'<p class="muted">The highlighted passage is the one RAGA used.</p>'}${(s.paras||[]).map((p,i)=>`<p class="para ${!s.user&&i===S.viewer.p?'hl':''}" ${i===S.viewer.p?'id="hlp"':''}>${esc(p)}</p>`).join('')}</aside>`;const h=$('#hlp');if(h&&h.scrollIntoView)h.scrollIntoView({block:'center'});return}
 if(S.modal==='new'){L.innerHTML=`<div class="scrim" data-act="closem"></div><div class="modal" role="dialog" aria-modal="true" aria-label="New notebook"><h3>New notebook</h3><label class="col g8"><span class="muted">Give it a name</span><input class="fld" id="nbname" maxlength="40" placeholder="e.g. Tax documents 2026" autofocus></label>${S.merr?`<p class="muted" style="color:var(--bad)">${S.merr}</p>`:''}<div class="row g8" style="justify-content:flex-end"><button class="btn soft" data-act="closem">Cancel</button><button class="btn lime" data-act="createnb">Create notebook</button></div></div>`;const i=$('#nbname');if(i)i.focus();return}
 const t=S.addTab;
 L.innerHTML=`<div class="scrim" data-act="closem"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Add sources"><div class="row sb"><h3>Add sources</h3><button class="iconbtn" data-act="closem" aria-label="Close">${ic('x',18)}</button></div><div class="tabs">${[['files','Upload files'],['link','Website'],['text','Paste text']].map(x=>`<button class="${t===x[0]?'on':''}" data-act="addtab" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
 ${t==='files'?`<div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose files to upload">${mascot('wow','lime',72)}<h4>Drag files here or click to browse</h4><div class="fmts">${['PDF','Word','Excel','Text','Markdown','CSV','Web page'].map(x=>`<span class="pill">${x}</span>`).join('')}</div></div><input type="file" id="file" multiple hidden>`:t==='link'?`<label class="col g8"><span class="muted">Web address</span><input class="fld" id="linkv" placeholder="https://example.com/article"></label>`:`<label class="col g8"><span class="muted">Title</span><input class="fld" id="ptitle" placeholder="Meeting notes"></label><label class="col g8"><span class="muted">Text</span><textarea class="fld" id="ptext" rows="5" placeholder="Paste your text here"></textarea></label>`}
 ${S.merr?`<p style="color:var(--bad);font-size:13.5px">${S.merr}</p>`:''}${t!=='files'?`<div class="row g8" style="justify-content:flex-end"><button class="btn lime" data-act="${t==='link'?'addlink':'addtext'}">Add source</button></div>`:''}</div>`;
}
/* ===== router ===== */
function render(){
 clearT();let r=(location.hash||'#home').slice(1)||'home';S.viewer=null;S.modal=null;
 if(r.startsWith('nb-')){const id=r.slice(3);if(nbBy(id)){S.nb=id;if(window.innerWidth<=980&&S.route!==r)S.tab='chat'}else r='notebooks'}
 else if(r!=='notebooks')r='home';
 S.route=r;const root=$('#root');
 if(r==='home')root.innerHTML=landing();
 else{seed();root.innerHTML=appTop(r)+(r==='notebooks'?vNotebooks():vWork(cur()));if(r!=='notebooks'){const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}}
 $('#layer').innerHTML='';window.scrollTo(0,0);
}
const A={
 theme:()=>toggleTheme(),toast:el=>toast(el.dataset.msg),go:el=>go(el.dataset.h),
 opennb:el=>go('nb-'+el.dataset.id),clearq:()=>{S.q='';render()},
 newnb:()=>{S.modal='new';S.merr='';paintModal()},closem:()=>{S.modal=null;S.viewer=null;S.merr='';paintModal()},
 createnb:()=>{const n=($('#nbname').value||'').trim();if(!n){S.merr='Give your notebook a name.';paintModal();return}const nb={id:'n'+Date.now(),title:n,color:COLORS[NBS.length%4],updated:'Just now',sources:[],qa:[],sugg:['What is this document about?','Summarise the key points'],studio:null};NBS.push(nb);S.modal=null;go('nb-'+nb.id);S.tab='sources';render()},
 addmodal:()=>{S.modal='add';S.addTab='files';S.merr='';paintModal()},addtab:el=>{S.addTab=el.dataset.v;S.merr='';paintModal()},
 addlink:()=>{const v=($('#linkv').value||'').trim();if(!/^(https?:\/\/)?[^\s.]+\.[^\s]{2,}$/.test(v)){S.merr='Enter a web address like https://example.com/article.';paintModal();return}const host=v.replace(/^https?:\/\//,'').replace(/\/$/,'');S.modal=null;addSrc(cur(),{name:host,type:'link',pages:'Web page'});paintModal();toast('Website added')},
 addtext:()=>{const t=($('#ptext').value||'').trim(),n=($('#ptitle').value||'').trim()||'Pasted text';if(t.length<10){S.merr='Paste at least a sentence of text.';paintModal();return}S.modal=null;addSrc(cur(),{name:n+'.txt',type:'txt',pages:'Pasted text',paras:[t]});paintModal();toast('Text added')},
 tog:el=>{const s=cur().sources.find(x=>x.id===el.dataset.id);s.on=!s.on;paintSide()},
 view:el=>{S.viewer={id:el.dataset.id,p:+el.dataset.p};S.modal='view';paintModal();const b=$('#layer .iconbtn');if(b)b.focus()},
 rmsrc:el=>{const nb=cur(),i=nb.sources.findIndex(x=>x.id===el.dataset.id),s=nb.sources[i];nb.sources.splice(i,1);S.undo={nb:nb.id,s,i};paintSide();toast('Removed '+s.name,['undo','Undo'])},
 undo:()=>{if(!S.undo)return;nbBy(S.undo.nb).sources.splice(S.undo.i,0,S.undo.s);S.undo=null;paintSide();toast('Restored')},
 retry:el=>{const s=cur().sources.find(x=>x.id===el.dataset.id);s.status='reading';s.prog=30;paintSide();S.timers.push(setTimeout(()=>{s.status='failed';s.error='Still locked. Remove the password in your PDF app, then add the file again.';paintSide()},1400))},
 wtab:el=>{S.tab=el.dataset.v;$('#ws').dataset.tab=S.tab;$$('.tabs3 button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tab))},
 send:()=>{const q=$('#q');if(!q||!q.value.trim())return;const v=q.value;q.value='';ask(v)},sugg:el=>ask(el.dataset.q),failq:()=>ask('Can I work from home?',true),
 newchat:()=>{clearT();S.chats[S.nb]=[];paintChat()},
 cite:el=>{const m=S.chats[S.nb][+el.dataset.i],r=m.refs[+el.dataset.n-1];A.view({dataset:{id:r.s,p:r.p}})},
 copyans:el=>copy(ansText(S.chats[S.nb][+el.dataset.i])),
 savenote:el=>{const m=S.chats[S.nb][+el.dataset.i];(S.notes[S.nb]=S.notes[S.nb]||[]).unshift({id:'t'+Date.now(),title:m.q,body:m.segs.map(s=>s.t).join(' ')});paintSide();toast('Saved to notes')},
 retryq:el=>run(cur(),S.chats[S.nb][+el.dataset.i],false),
 gen:el=>{const nb=cur(),n=act(nb).length;if(!n){toast('Select at least one source first.');return}const x={id:'o'+Date.now(),kind:el.dataset.k,loading:true,n};(S.out[nb.id]=S.out[nb.id]||[]).unshift(x);paintSide();S.timers.push(setTimeout(()=>{x.loading=false;paintSide()},1200))},
 rmout:el=>{S.out[S.nb]=S.out[S.nb].filter(x=>x.id!==el.dataset.id);paintSide()},
 copyout:el=>{const nb=cur(),x=S.out[nb.id].find(o=>o.id===el.dataset.id),d=nb.studio;copy(!d?'':x.kind==='summary'?d.summary:x.kind==='guide'?d.guide.join('\n'):x.kind==='faq'?d.faq.map(f=>f[0]+'\n'+f[1]).join('\n\n'):d.topics.join(', '))},
 savenoteout:el=>{const nb=cur(),x=S.out[nb.id].find(o=>o.id===el.dataset.id),d=nb.studio;if(!d){toast('Nothing to save yet');return}(S.notes[nb.id]=S.notes[nb.id]||[]).unshift({id:'t'+Date.now(),title:NOUN[x.kind][0],body:x.kind==='summary'?d.summary:x.kind==='guide'?d.guide.join(' '):x.kind==='faq'?d.faq.map(f=>f[0]+' '+f[1]).join(' '):d.topics.join(', ')});paintSide();toast('Saved to notes')},
 copynote:el=>copy(S.notes[S.nb].find(n=>n.id===el.dataset.id).body),rmnote:el=>{S.notes[S.nb]=S.notes[S.nb].filter(n=>n.id!==el.dataset.id);paintSide()}
};
document.addEventListener('click',e=>{
 const sc=e.target.closest('[data-scroll]');if(sc){const t=document.getElementById(sc.dataset.scroll);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}
 const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act]){A[el.dataset.act](el);return}
 if(e.target.closest('#drop')&&S.modal==='add'){const f=$('#file');if(f)f.click()}
});
document.addEventListener('input',e=>{if(e.target.id==='nbq'){S.q=e.target.value;const g=$('.nbgrid');if(g){const pos=e.target.selectionStart;render();const i=$('#nbq');i.focus();i.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{if(e.target.id==='file'){addFiles(e.target.files);e.target.value=''}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Escape'&&S.modal)A.closem();if(e.key==='Enter'&&t.id==='q'&&!e.shiftKey){e.preventDefault();A.send()}if(e.key==='Enter'&&t.id==='nbname'){e.preventDefault();A.createnb()}if((e.key==='Enter'||e.key===' ')&&t.id==='drop'){e.preventDefault();$('#file').click()}});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();addFiles(e.dataTransfer.files)}});
window.addEventListener('hashchange',render);
const saved=ls.get('raga-theme','');if(saved)document.documentElement.setAttribute('data-theme',saved);
render();
})();
</script>

</body></html>
