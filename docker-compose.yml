services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-research-backend
    ports:
      # Host port 8090 by default (8080 is often taken locally); inside the network it stays 8080.
      - "${RAGA_PORT:-8090}:8080"
    depends_on:
      - chromadb
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-flash-lite-latest}
      - APP_API_KEY=${APP_API_KEY}
      - WEBHOOK_API_KEY=${WEBHOOK_API_KEY:-}
      - CHROMA_URL=http://chromadb:8000
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-platform
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      # Current chromadb/chroma images persist to /data (older 0.x images used /chroma/chroma).
      - chroma-data:/data
    networks:
      - ai-platform
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - ai-platform
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://backend:8080
    restart: unless-stopped

volumes:
  chroma-data:
  n8n-data:

networks:
  ai-platform:
    driver: bridge